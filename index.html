<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>محادثة Ollama Cloud</title>
<style>
  :root{
    --bg:#171310;
    --panel:#211a15;
    --panel-2:#2b221b;
    --line:#3a2e25;
    --text:#efe4d5;
    --muted:#a89684;
    --accent:#d4a373;
    --accent-2:#c1785a;
    --user:#3b2c22;
    --bot:#241c16;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Segoe UI','Tahoma',system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%, #2a2018 0%, var(--bg) 60%);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .app{
    width:min(860px,100%);
    height:min(90vh,760px);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }
  header{
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(180deg,#251c16,#1d1610);
  }
  header h1{
    margin:0;
    font-size:16px;
    letter-spacing:.4px;
    font-weight:600;
    color:var(--text);
  }
  header .meta{
    font-size:12px;
    color:var(--muted);
    direction:ltr;
  }
  header .dot{
    display:inline-block;
    width:8px;height:8px;border-radius:50%;
    background:#7ab87a;
    margin-inline-start:6px;
    box-shadow:0 0 8px #7ab87a88;
  }
  .messages{
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
    scroll-behavior:smooth;
  }
  .messages::-webkit-scrollbar{width:8px}
  .messages::-webkit-scrollbar-thumb{background:#3a2e25;border-radius:8px}
  .msg{
    max-width:78%;
    padding:12px 16px;
    border-radius:14px;
    line-height:1.7;
    white-space:pre-wrap;
    word-wrap:break-word;
    font-size:15px;
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{
    align-self:flex-start;
    background:var(--user);
    border:1px solid #4a3729;
    border-bottom-right-radius:4px;
  }
  .msg.bot{
    align-self:flex-end;
    background:var(--bot);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
    color:#eadfce;
  }
  .msg.error{
    align-self:center;
    background:#3b1f1f;
    border:1px solid #6b2e2e;
    color:#ffd0d0;
    font-size:13px;
    max-width:92%;
    text-align:center;
  }
  .typing{
    align-self:flex-end;
    background:var(--bot);
    border:1px solid var(--line);
    padding:12px 16px;
    border-radius:14px;
    border-bottom-left-radius:4px;
    display:none;
    gap:5px;
  }
  .typing.on{display:inline-flex}
  .typing span{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  form{
    padding:14px;
    border-top:1px solid var(--line);
    display:flex;
    gap:10px;
    background:#1a140f;
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-family:inherit;
    font-size:15px;
    line-height:1.6;
    min-height:48px;
    max-height:160px;
    outline:none;
    transition:border-color .15s;
  }
  textarea:focus{border-color:var(--accent-2)}
  button{
    background:linear-gradient(180deg,var(--accent),var(--accent-2));
    color:#1a1108;
    border:none;
    border-radius:12px;
    padding:0 22px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:transform .08s, filter .15s;
  }
  button:hover{filter:brightness(1.07)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .footer{
    padding:8px 16px 12px;
    font-size:11px;
    color:var(--muted);
    text-align:center;
    direction:ltr;
  }
  .clear{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
  }
  .clear:hover{color:var(--text);border-color:var(--accent-2)}
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>محادثة Ollama Cloud <span class="dot"></span></h1>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="meta">gemma4:31b</span>
        <button class="clear" id="clearBtn" type="button">مسح</button>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="msg bot">أهلاً. اكتب أي شي وأنا أرد عليك عبر Ollama Cloud.</div>
    </div>

    <form id="chatForm">
      <textarea id="input" placeholder="اكتب رسالتك… (Enter للإرسال، Shift+Enter لسطر جديد)" rows="1"></textarea>
      <button id="sendBtn" type="submit">إرسال</button>
    </form>

    <div class="footer">Ollama Cloud · https://ollama.com · المفتاح محفوظ على السيرفر فقط</div>
  </div>

<script>
const messagesEl = document.getElementById("messages");
const form       = document.getElementById("chatForm");
const input      = document.getElementById("input");
const sendBtn    = document.getElementById("sendBtn");
const clearBtn   = document.getElementById("clearBtn");

let history = [];        // [{role, content}, ...]
let busy    = false;

function addMessage(role, text, extraClass = ""){
  const div = document.createElement("div");
  div.className = `msg ${role} ${extraClass}`.trim();
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addTyping(){
  const t = document.createElement("div");
  t.className = "typing on";
  t.id = "typingIndicator";
  t.innerHTML = "<span></span><span></span><span></span>";
  messagesEl.appendChild(t);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping(){
  document.getElementById("typingIndicator")?.remove();
}

async function sendMessage(text){
  addMessage("user", text);
  history.push({ role: "user", content: text });

  busy = true;
  sendBtn.disabled = true;
  input.disabled = true;
  addTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });

    const data = await res.json();
    removeTyping();

    if (!res.ok || data.error) {
      addMessage("error", data.error || `HTTP ${res.status}`, "error");
    } else {
      const reply = data?.message?.content ?? data?.choices?.[0]?.message?.content ?? JSON.stringify(data);
      addMessage("bot", reply);
      history.push({ role: "assistant", content: reply });
    }
  } catch (e) {
    removeTyping();
    addMessage("error", "فشل الاتصال بالسيرفر: " + e.message, "error");
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "auto";
  sendMessage(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});

clearBtn.addEventListener("click", () => {
  if (busy) return;
  history = [];
  messagesEl.innerHTML = "";
  addMessage("bot", "تم مسح المحادثة. اكتب من جديد.");
  input.focus();
});

input.focus();
</script>
</body>
</html>
